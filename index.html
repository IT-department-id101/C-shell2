function synSkip(L){const S=new Set();let on=false;L.forEach((l,i)=>{const t=l.trim();if(t.startsWith('//')&&!/^\s/.test(l)){on=/گشتی|شێوازی بانگکردن|دروستکردنی میسۆد/.test(t);}if(on)S.add(i);});return S;}
const li=(r,sn,tx)=>`<li><span class="rng">${r}</span><span>${sn?`<b class="sn${sn.length>=25?' xs':sn.length>13?' sm':''}">${esc(sn)}</b> : `:''}${tx}</span></li>`;
function expl(e,items){const L=e.c.split('\n'),cl=[],cm=[];
 const syn=synSkip(L);L.forEach((l,i)=>{if(syn.has(i))return;const t=l.trim();if(!t)return;if(t.startsWith('//'))cm.push(i+1);else cl.push({i:i+1,t:t.replace(/\s*\/\/.*$/,'').trim()});});
 let o='';
 if(cm.length){let s=cm[0],p=s;const r=[];
  for(let k=1;k<cm.length;k++){if(cm[k]===p+1)p=cm[k];else{r.push(s===p?n(s):n(s)+'-'+n(p));s=p=cm[k];}}
  r.push(s===p?n(s):n(s)+'-'+n(p));
  o+=li(r.join('، '),'// کۆمێنت','ئەم هێڵانە کۆمێنتن؛ جێبەجێ ناکرێن و هیچ چاپ ناکرێن، تەنها بۆ خوێندنەوەی مرۆڤن.');}
 const map={},extra=[];let cur=0;
 for(const [sn,tx] of items){if(!sn){extra.push(tx);continue;}
  let f=-1;for(let k=cur;k<cl.length;k++){if(cl[k].t===sn.trim()){f=k;break;}}
  if(f<0){extra.push(tx);continue;}map[f]=tx;cur=f+1;}
 const sk=bpSkip(cl.map(c=>c.t));cl.forEach((c,k)=>{if(sk.has(k))return;const tx=map[k]||(c.t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':c.t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—');o+=li(n(c.i),c.t,tx);});
 extra.forEach(tx=>{o+=li('💡','',tx);});
 return o;}

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(line){let r='',l=0,m;RX.lastIndex=0;
 while((m=RX.exec(line))){r+=esc(line.slice(l,m.index));
  const c=m[1]?'cmt':m[2]?'str':m[3]?'dt':m[4]?'con':m[5]?'kw':m[6]?'num':m[7]?'cls':m[8]?'fn':m[9]?'var':'op';
  r+=`<span class="${c}">${esc(m[0])}</span>`;l=RX.lastIndex;}
 return r+esc(line.slice(l));}

 m.s.forEach(([sn,tx,st])=>{for(let q=cur;q<L.length;q++){if(L[q].trim()===sn){map[q]=[tx,st||[]];cur=q+1;break;}}});
 const sk=bpSkip(L.map(x=>x.trim()));const cards=L.map((l,i)=>{if(sk.has(i))return '';const t=l.trim();const d=map[i]||[t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—',[]];
  return `<div class="st"><div class="st-h"><span class="rng">${n(i+1)}</span><b class="sn${t.length>=25?' xs':t.length>13?' sm':''}">${esc(t)}</b></div><p>${d[0]}</p>${d[1].length?`<div class="st-v"><span>بەهاکان دوای ئەم هێڵە:</span>${d[1].map(v=>`<i class="vs">${v}</i>`).join('')}</div>`:''}</div>`;}).join('');
 return `<button class="more-btn" onclick="toggleMore(${k},this)">ڕوونکردنەوەی زیاتر 📖</button>
<div class="more-panel" id="more${k}"><div class="more-title">ڕوونکردنەوەی زیاتر — بە نموونەیەکی نوێ</div><div class="walk"><span class="wl">کارەکەی ئەم کۆدە بە کورتی:</span>${m.intro}</div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(m.o)}</div></div>
