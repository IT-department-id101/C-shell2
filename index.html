.lb{font-size:12px;font-weight:800;color:#7c3aed;margin-bottom:2px}
.more-legend{font-size:13px;color:#4b5563;margin-bottom:14px;line-height:2.2}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#1fa855;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#667eea}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#7c3aed}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
</style>

<script>
const E=[{"t":"Arithmetic Operators – ئۆپەراتۆری ماتماتیکی","p":"PDF P.18-19","c":"// ئۆپەراتۆری + بۆ کۆکردنەوەی دوو بەهایە\nint x = 10 + 20;\n// دەتوانرێت گۆڕاو و بەهاش کۆبکرێنەوە\nint sum1 = 100 + 50;      // 150 (100 + 50)\nint sum2 = sum1 + 250;    // 400 (150 + 250)\nint sum3 = sum2 + sum2;   // 800 (400 + 400)","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Assignment Operators – ئۆپەراتۆری بەهادان","p":"PDF P.19-20","c":"int x = 10;   // = بەهای 10 دەدات بە x\nx += 5;       // x = x + 5","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Comparison & Logical Operators – بەراوردکردن و لۆژیک","p":"PDF P.20-21","c":"int x = 3;\n// ئۆپەراتۆری بەراوردکردن\nConsole.WriteLine(x == 3);\nConsole.WriteLine(x != 3);\nConsole.WriteLine(x >= 5);\n// ئۆپەراتۆری لۆژیکی\nConsole.WriteLine(x < 5 && x < 10);\nConsole.WriteLine(x < 5 || x < 2);\nConsole.WriteLine(!(x < 5 && x < 10));","o":"True\nFalse\nFalse\nTrue\nTrue\nFalse"},{"t":"The if Statement – فەرمانی if","p":"PDF P.22","c":"int x = 20;\nint y = 18;\n\nif (x > y)\n{\n  Console.WriteLine(\"x is greater than y\");\n}","o":"x is greater than y"},{"t":"else & else if – ئەگەرنا","p":"PDF P.23-24","c":"int time = 22;\nif (time < 10)\n{\n  Console.WriteLine(\"Good morning.\");\n}\nelse if (time < 20)\n{\n  Console.WriteLine(\"Good day.\");\n}\nelse\n{\n  Console.WriteLine(\"Good evening.\");\n}","o":"Good evening."},{"t":"Short Hand If...Else (Ternary) – شێوازی کورتی if","p":"PDF P.24-25","c":"// شێوازی درێژ\nint time = 20;\nif (time < 18)\n{\n  Console.WriteLine(\"Good day.\");\n}\nelse\n{\n  Console.WriteLine(\"Good evening.\");\n}\n\n// شێوازی کورت (Ternary)\nstring result = (time < 18) ? \"Good day.\" : \"Good evening.\";\nConsole.WriteLine(result);","o":"Good evening.\nGood evening."},{"t":"Switch Statement – فەرمانی switch","p":"PDF P.25-27","c":"int day = 4;\nswitch (day)\n{\n  case 1:\n    Console.WriteLine(\"Monday\");\n    break;\n  case 2:\n    Console.WriteLine(\"Tuesday\");\n    break;\n  case 3:\n    Console.WriteLine(\"Wednesday\");\n    break;\n  case 4:\n    Console.WriteLine(\"Thursday\");\n    break;\n  case 5:\n    Console.WriteLine(\"Friday\");\n    break;\n  case 6:\n    Console.WriteLine(\"Saturday\");\n    break;\n  case 7:\n    Console.WriteLine(\"Sunday\");\n    break;\n}","o":"Thursday"},{"t":"The default Keyword – وشەی default","p":"PDF P.27","c":"int day = 4;\nswitch (day)\n{\n  case 6:\n    Console.WriteLine(\"Today is Saturday.\");\n    break;\n  case 7:\n    Console.WriteLine(\"Today is Sunday.\");\n    break;\n  default:\n    Console.WriteLine(\"Looking forward to the Weekend.\");\n    break;\n}","o":"Looking forward to the Weekend."},{"t":"For Loop – لووپی for","p":"PDF P.28","c":"// for: کاتێک ژمارەی دووبارەبوونەوە دیارە\nfor (int i = 0; i < 5; i++)\n{\n  Console.WriteLine(i);\n}","o":"0\n1\n2\n3\n4"},{"t":"Foreach Loop – لووپی foreach","p":"PDF P.29","c":"// foreach: بۆ ڕیزکردنی ئەندامەکانی ئارەی\nstring[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nforeach (string i in cars)\n{\n  Console.WriteLine(i);\n}","o":"Volvo\nBMW\nFord\nMazda"},{"t":"While Loop – لووپی while","p":"PDF P.29-30","c":"// while: تا مەرجەکە ڕاست بێت دووبارە دەبێتەوە\nint i = 0;\nwhile (i < 5)\n{\n  Console.WriteLine(i);\n  i++;\n}","o":"0\n1\n2\n3\n4"},{"t":"Do/While Loop – لووپی do/while","p":"PDF P.30","c":"// do/while: یەکجار دەخوێنرێت پێش تاقیکردنەوەی مەرج\nint j = 0;\ndo\n{\n  Console.WriteLine(j);\n  j++;\n}\nwhile (j < 5);","o":"0\n1\n2\n3\n4"},{"t":"Break in For Loop – وەستاندنی لووپ بە break","p":"PDF P.31-32","c":"// break: لە لووپ دەردەچێت کاتێک i == 4\nfor (int i = 0; i < 10; i++)\n{\n  if (i == 4)\n  {\n    break;\n  }\n  Console.WriteLine(i);\n}","o":"0\n1\n2\n3"},{"t":"Continue in For Loop – بازدانی یەک دووبارەبوونەوە بە continue","p":"PDF P.32","c":"// continue: تەنها ئەم دووبارەبوونەوەیە بازدەدات\nfor (int i = 0; i < 10; i++)\n{\n  if (i == 4)\n  {\n    continue;\n  }\n  Console.WriteLine(i);\n}","o":"0\n1\n2\n3\n5\n6\n7\n8\n9"},{"t":"Break in While Loop – وەستاندنی لووپی while بە break","p":"PDF P.32-33","c":"// Break Example\nint i = 0;\nwhile (i < 10)\n{\n  Console.WriteLine(i);\n  i++;\n  if (i == 4)\n  {\n    break;\n  }\n}","o":"0\n1\n2\n3"},{"t":"Continue in While Loop – بازدان لە لووپی while بە continue","p":"PDF P.32-33","c":"// Continue Example\nint i = 0;\nwhile (i < 10)\n{\n  if (i == 4)\n  {\n    i++;\n    continue;\n  }\n  Console.WriteLine(i);\n  i++;\n}","o":"0\n1\n2\n3\n5\n6\n7\n8\n9"}];

const li=(r,sn,tx)=>`<li><span class="rng">${r==='💡'?r:'هێڵی '+r}</span><span>${sn?`<b class="sn${sn.length>=25?' xs':sn.length>13?' sm':''}">${esc(sn)}</b> : `:''}${tx}</span></li>`;
function expl(e,items){const L=e.c.split('\n'),cl=[],cm=[];
 L.forEach((l,i)=>{const t=l.trim();if(!t)return;if(t.startsWith('//'))cm.push(i+1);else cl.push({i:i+1,t:t.replace(/\s*\/\/.*$/,'').trim()});});
 let o='';
 if(cm.length){let s=cm[0],p=s;const r=[];
  for(let k=1;k<cm.length;k++){if(cm[k]===p+1)p=cm[k];else{r.push(s===p?s:s+'-'+p);s=p=cm[k];}}
  r.push(s===p?s:s+'-'+p);
  o+=li(r.join('، '),'// کۆمێنت','ئەم هێڵانە کۆمێنتن؛ جێبەجێ ناکرێن و هیچ چاپ ناکرێن، تەنها بۆ خوێندنەوەی مرۆڤن.');}
 const map={},extra=[];let cur=0;
 for(const [sn,tx] of items){if(!sn){extra.push(tx);continue;}
  let f=-1;for(let k=cur;k<cl.length;k++){if(cl[k].t===sn.trim()){f=k;break;}}
  if(f<0){extra.push(tx);continue;}map[f]=tx;cur=f+1;}
 cl.forEach((c,k)=>{const tx=map[k]||(c.t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':c.t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—');o+=li(c.i,c.t,tx);});
 extra.forEach(tx=>{o+=li('💡','',tx);});
 return o;}
const RX=/(\/\/.*)|("(?:[^"\\]|\\.)*")|\b(int|string|void|class)\b|\b(if|else|for|foreach|while|do|switch|case|break|continue|default)\b|\b(static|in)\b|\b(\d+)\b|\b(Console|Math|Program|String)\b|\b([A-Za-z_]\w*)(?=\s*\()|\b([A-Za-z_]\w*)\b|([=+\-*\/%<>!&|?:^]+)/g;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(line){let r='',l=0,m;RX.lastIndex=0;
 while((m=RX.exec(line))){r+=esc(line.slice(l,m.index));
  const c=m[1]?'cmt':m[2]?'str':m[3]?'dt':m[4]?'con':m[5]?'kw':m[6]?'num':m[7]?'cls':m[8]?'fn':m[9]?'var':'op';
  r+=`<span class="${c}">${esc(m[0])}</span>`;l=RX.lastIndex;}
 return r+esc(line.slice(l));}
const MORE=[{"c":"int a = 7;\nint b = 3;\nint sum = a + b;\nint rest = a % b;\nConsole.WriteLine(sum);\nConsole.WriteLine(rest);","o":"10\n1","intro":"سەرەتا گۆڕاوی <code>a</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 7ـمان پێدا، و گۆڕاوی <code>b</code>ی دووەممان دروست کرد و بەهای 3ـمان پێدا. دواتر <code>sum</code>مان دروست کرد و ئەنجامی a + b واتە 10ـمان تێدا دانا. پاشان <code>rest</code>مان دروست کرد و بە <code>%</code> ماوەی a ÷ b واتە 1ـمان تێدا دانا. لە کۆتاییدا بە <code>Console.WriteLine</code> هەردووکیان چاپ دەکەین: 10 و 1.","s":[["int a = 7;","سندوقێک بە ناوی <code>a</code> دروست دەکات (<code>int</code> = ژمارەی تەواو) و 7 دەخاتە ناوی.",["a = 7"]],["int b = 3;","سندوقێکی تر بە ناوی <code>b</code> دروست دەکات و 3 دەخاتە ناوی.",["a = 7","b = 3"]],["int sum = a + b;","<code>+</code> کۆ دەکات: بەهای a (7) و b (3) دەخوێنێتەوە و ئەنجامی 10 دەخاتە ناو <code>sum</code>.",["sum = 10"]],["int rest = a % b;","<code>%</code> ماوەی دابەشکردن دەدات: 7 ÷ 3 دەبێتە 2 و ماوەی 1، بۆیە 1 دەخاتە ناو <code>rest</code>.",["rest = 1"]],["Console.WriteLine(sum);","بەهای <code>sum</code> چاپ دەکات: 10.",[]],["Console.WriteLine(rest);","بەهای <code>rest</code> چاپ دەکات: 1.",[]]],"sum":"پوختە: <code>+</code> کۆ دەکات و <code>%</code> ماوەی دابەشکردن دەدات. هەر ئەنجامێک لە گۆڕاوێکی نوێدا هەڵدەگیرێت."},{"c":"int a = 100;\nint b = 1;\na += b;\nConsole.WriteLine(a);","o":"101","intro":"سەرەتا گۆڕاوی <code>a</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 100ـمان پێدا، و گۆڕاوی <code>b</code>ـمان دروست کرد و بەهای 1ـمان پێدا. دواتر بە <code>+=</code> بەهای bمان خستە سەر بەهای ئێستای a، واتە 100 + 1، و a بوو بە 101. لە کۆتاییدا بە <code>Console.WriteLine</code> بەهای a چاپ دەکەین: 101.","s":[["int a = 100;","کۆمپیوتەر سندوقێکی بچووک لە بیرگەدا دروست دەکات و ناوی دەنێت <code>a</code>. <code>int</code> واتە ئەم سندوقە تەنها ژمارەی تەواو دەگرێت. پاشان ژمارە 100 دەخاتە ناوی.",["a = 100"]],["int b = 1;","سندوقێکی دووەم بە ناوی <code>b</code> دروست دەکات و 1 دەخاتە ناوی. ئێستا دوو سندوقمان هەیە.",["a = 100","b = 1"]],["a += b;","ئەم هێڵە هەمان <code>a = a + b</code>ـە. کۆمپیوتەر سێ کار دەکات: (١) بەهای a دەخوێنێتەوە: 100. (٢) بەهای b دەخوێنێتەوە: 1. (٣) کۆیان دەکاتەوە (100 + 1 = 101) و دەیخاتە ناو a، بەهای کۆنی a دەسڕدرێتەوە. سەرنج بدە: b هەروەک خۆی ماوەتەوە، تەنها a گۆڕا.",["a = 101","b = 1"]],["Console.WriteLine(a);","بەهای ئێستای a چاپ دەکات. چونکە لە هێڵی ٣ بوو بە 101، ئەوە چاپ دەکرێت، نەک 100.",["a = 101"]]],"sum":"پوختە: <code>a += b</code> بەهای b دەخاتە سەر بەهای ئێستای a. بەراورد لەگەڵ نموونەی سەرەوە: لەوێ ژمارەیەکی ڕاستەوخۆ (5) زیاد کرا، لێرە بەهای گۆڕاوێکی تر (b) زیاد کرا."},{"c":"int age = 20;\nConsole.WriteLine(age >= 18);\nConsole.WriteLine(age < 18);\nConsole.WriteLine(age >= 18 && age <= 25);\nConsole.WriteLine(!(age >= 18));","o":"True\nFalse\nTrue\nFalse","intro":"سەرەتا گۆڕاوی <code>age</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 20ـمان پێدا. دواتر بە <code>Console.WriteLine</code> چوار ئەنجامی بەراوردکردنمان چاپ کرد: age گەورەترە یان یەکسانە بە 18؟ بەڵێ (True). age کەمترە لە 18؟ نەخێر (False). age هەم گەورەترە یان یەکسانە بە 18 و هەم کەمترە یان یەکسانە بە 25؟ بەڵێ هەردووکیان ڕاستن (True). لە کۆتاییدا <code>!</code> ئەنجامی مەرجی یەکەم پێچەوانە دەکاتەوە (False).","s":[["int age = 20;","گۆڕاوی <code>age</code> دروست دەکات و 20 دەیداتێ.",["age = 20"]],["Console.WriteLine(age >= 18);","<code>&gt;=</code> دەپرسێت: 20 گەورەترە یان یەکسانە بە 18؟ بەڵێ، بۆیە <b>True</b> چاپ دەکات.",[]],["Console.WriteLine(age < 18);","20 کەمترە لە 18؟ نەخێر، بۆیە <b>False</b>.",[]],["Console.WriteLine(age >= 18 && age <= 25);","<code>&amp;&amp;</code> واتە هەردوو مەرج دەبێت ڕاست بن: 20 &gt;= 18 ڕاستە و 20 &lt;= 25 ڕاستە، بۆیە <b>True</b>.",[]],["Console.WriteLine(!(age >= 18));","ناو کەوانە True ـە و <code>!</code> پێچەوانەی دەکاتەوە، بۆیە <b>False</b>.",[]]],"sum":"پوختە: بەراوردکردن True/False دەدات، <code>&amp;&amp;</code> هەردووکیان دەوێت، <code>!</code> پێچەوانە دەکاتەوە."},{"c":"int temp = 35;\nif (temp > 30)\n{\n  Console.WriteLine(\"Hot\");\n}","o":"Hot","intro":"سەرەتا گۆڕاوی <code>temp</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 35ـمان پێدا. دواتر بە <code>if</code> مەرجمان دانا: 35 گەورەترە لە 30؟ بەڵێ. بۆیە <code>Console.WriteLine</code> دەقی Hot چاپ دەکات.","s":[["int temp = 35;","گۆڕاوی <code>temp</code> (پلەی گەرمی) دروست دەکات و 35 دەیداتێ.",["temp = 35"]],["if (temp > 30)","دەپشکنێت: 35 گەورەترە لە 30؟ بەڵێ، ڕاستە (True).",[]],["Console.WriteLine(\"Hot\");","Hot چاپ دەکات.",[]]],"sum":"پوختە: کۆدی ناو <code>{ }</code> بە مەرجی if ـەوە بەستراوەتەوە."},{"c":"int score = 75;\nif (score >= 90)\n{\n  Console.WriteLine(\"A\");\n}\nelse if (score >= 70)\n{\n  Console.WriteLine(\"B\");\n}\nelse\n{\n  Console.WriteLine(\"C\");\n}","o":"B","intro":"سەرەتا گۆڕاوی <code>score</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 75ـمان پێدا. دواتر بە <code>if</code> پرسیارمان کرد: 75 گەورەترە یان یەکسانە بە 90؟ نەخێر. پاشان بە <code>else if</code>: 75 گەورەترە یان یەکسانە بە 70؟ بەڵێ، بۆیە <code>Console.WriteLine</code> دەقی B چاپ دەکات.","s":[["int score = 75;","گۆڕاوی <code>score</code> دروست دەکات و 75 دەیداتێ.",["score = 75"]],["if (score >= 90)","75 >= 90؟ نەخێر، هەڵەیە (False).",[]],["Console.WriteLine(\"A\");","A چاپ دەکات.",[]],["else if (score >= 70)","مەرجی دووەم: 75 >= 70؟ بەڵێ، ڕاستە (True).",[]],["Console.WriteLine(\"B\");","B چاپ دەکات.",[]],["else","ئەگەرنا: ئەگەر هیچ مەرجێکی سەرەوە ڕاست نەبێت.",[]],["Console.WriteLine(\"C\");","C چاپ دەکات.",[]]],"sum":"پوختە: مەرجەکان بە ڕیز دەپشکنرێن و تەنها یەکەم مەرجی ڕاست دەگیرێت."},{"c":"int age = 16;\nstring msg = (age >= 18) ? \"Adult\" : \"Child\";\nConsole.WriteLine(msg);","o":"Child","intro":"سەرەتا گۆڕاوی <code>age</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 16ـمان پێدا. دواتر گۆڕاوی <code>msg</code>مان دروست کرد بە جۆری <code>string</code> (دەق) و بە <code>?</code> مەرجی age &gt;= 18مان پشکنی؛ چونکە 16 لە 18 کەمترە، مەرجەکە هەڵەیە و دەقی دوای <code>:</code> واتە Child کەوتە ناو msg. لە کۆتاییدا <code>Console.WriteLine</code> بەهای msg چاپ دەکات: Child.","s":[["int age = 16;","گۆڕاوی <code>age</code> دروست دەکات و 16 دەیداتێ.",["age = 16"]],["string msg = (age >= 18) ? \"Adult\" : \"Child\";","<code>string</code> واتە دەق. مەرج دەپشکنێت: 16 >= 18؟ نەخێر، بۆیە بەشی دوای <code>:</code> واتە \"Child\" دەخاتە ناو msg.",["msg = \"Child\""]],["Console.WriteLine(msg);","بەهای msg چاپ دەکات: Child.",[]]],"sum":"پوختە: <code>(مەرج) ? ئەگەرڕاست : ئەگەرهەڵە</code> لە یەک هێڵدا بەهایەک هەڵدەبژێرێت."},{"c":"int n = 2;\nswitch (n)\n{\n  case 1:\n    Console.WriteLine(\"One\");\n    break;\n  case 2:\n    Console.WriteLine(\"Two\");\n    break;\n  case 3:\n    Console.WriteLine(\"Three\");\n    break;\n}","o":"Two","intro":"سەرەتا گۆڕاوی <code>n</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 2ـمان پێدا. دواتر بە <code>switch</code> بەهای nمان دایە بەراوردکردن لەگەڵ caseـەکان: case 1 یەکسان نییە، بەڵام case 2 یەکسانە، بۆیە <code>Console.WriteLine</code> دەقی Two چاپ دەکات و <code>break</code> لە switch دەردەچێت.","s":[["int n = 2;","گۆڕاوی <code>n</code> دروست دەکات و 2 دەیداتێ.",["n = 2"]],["switch (n)","بەهای n (2) دەپشکنێت و لەگەڵ caseـەکان بەراوردی دەکات.",[]],["case 1:","2 یەکسانە بە 1؟ نەخێر.",[]],["Console.WriteLine(\"One\");","One چاپ دەکات.",[]],["break;","لە switch دەردەچێت.",[]],["case 2:","2 یەکسانە بە 2؟ بەڵێ، لێرەوە کۆد دەست پێدەکات.",[]],["Console.WriteLine(\"Two\");","Two چاپ دەکات.",[]],["break;","لە switch دەردەچێت، بۆیە case 3 نابینرێت.",[]],["case 3:","2 یەکسانە بە 3؟ نەخێر.",[]],["Console.WriteLine(\"Three\");","Three چاپ دەکات.",[]],["break;","لە switch دەردەچێت.",[]]],"sum":"پوختە: switch لە caseی یەکسان دەست پێدەکات و <code>break</code> دەردەچێت."},{"c":"int n = 9;\nswitch (n)\n{\n  case 1:\n    Console.WriteLine(\"One\");\n    break;\n  default:\n    Console.WriteLine(\"Other\");\n    break;\n}","o":"Other","intro":"سەرەتا گۆڕاوی <code>n</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 9ـمان پێدا. دواتر بە <code>switch</code> بەهای nمان بەراورد کرد لەگەڵ case 1؛ یەکسان نییە و caseی تر نییە. بۆیە <code>default</code> دێت و <code>Console.WriteLine</code> دەقی Other چاپ دەکات.","s":[["int n = 9;","گۆڕاوی <code>n</code> دروست دەکات و 9 دەیداتێ.",["n = 9"]],["switch (n)","بەهای n (9) دەپشکنێت.",[]],["case 1:","9 یەکسانە بە 1؟ نەخێر.",[]],["Console.WriteLine(\"One\");","One چاپ دەکات.",[]],["break;","لە switch دەردەچێت.",[]],["default:","ئەگەر هیچ case ێک یەکسان نەبێت (9 نە 1ـە).",[]],["Console.WriteLine(\"Other\");","Other چاپ دەکات.",[]],["break;","لە switch دەردەچێت.",[]]],"sum":"پوختە: default وەک «ئەگەرنا»ی switch وایە."},{"c":"for (int i = 1; i <= 3; i++)\n{\n  Console.WriteLine(i * 2);\n}","o":"2\n4\n6","intro":"سەرەتا بە <code>for</code> گۆڕاوی <code>i</code>مان دروست کرد و بەهای 1ـمان پێدا، و مەرجمان دانا تا i کەمتر یان یەکسان بێت بە 3 لووپەکە بەردەوام بێت و هەر جارێک i یەک زیاد بێت. لە ناو لووپەکە <code>Console.WriteLine</code> هەر جارێک i لێک دەدات بە 2 و چاپی دەکات، بۆیە 2 و 4 و 6 دەبینین.","s":[["for (int i = 1; i <= 3; i++)","i لە 1 دەست پێدەکات، تا i &lt;= 3 بەردەوام دەبێت، و لەدوای هەر دووبارەبوونەوەیەک یەک زیاد دەکات.",["i = 1 ، 2 ، 3"]],["Console.WriteLine(i * 2);","لە هەر دووبارەبوونەوەیەکدا i لێک دەدات بە 2 و چاپی دەکات: 2 ، 4 ، 6.",[]]],"sum":"پوختە: for کاتێک ژمارەی دووبارەبوونەوە دیارە."},{"c":"string[] fruits = {\"Apple\", \"Kiwi\"};\nforeach (string f in fruits)\n{\n  Console.WriteLine(f);\n}","o":"Apple\nKiwi","intro":"سەرەتا ئارەی <code>fruits</code>مان دروست کرد بە جۆری <code>string[]</code> و دوو ناوی Apple و Kiwiمان تێدا دانا. دواتر بە <code>foreach</code> هەر ئەندامێکمان یەک بە یەک خستە ناو گۆڕاوی <code>f</code>، و <code>Console.WriteLine</code> هەر جارێک f چاپ دەکات، بۆیە Apple پاشان Kiwi دەبینین.","s":[["string[] fruits = {\"Apple\", \"Kiwi\"};","ئارەیەک بە ناوی <code>fruits</code> دروست دەکات کە دوو دەقی تێدایە.",[]],["foreach (string f in fruits)","هەر ئەندامێکی fruits دەخاتە ناو <code>f</code> یەک بە یەک.",[]],["Console.WriteLine(f);","Apple پاشان Kiwi چاپ دەکات.",[]]],"sum":"پوختە: foreach بۆ ئەندامەکانی ئارەییە."},{"c":"int n = 3;\nwhile (n > 0)\n{\n  Console.WriteLine(n);\n  n--;\n}","o":"3\n2\n1","intro":"سەرەتا گۆڕاوی <code>n</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 3ـمان پێدا. دواتر بە <code>while</code> مەرجمان دانا: تا n گەورەتر بێت لە 0 لووپەکە دووبارە ببێتەوە. لە ناو لووپەکە <code>Console.WriteLine</code> بەهای n چاپ دەکات و <code>n--</code> یەک کەمی دەکات، بۆیە 3 و 2 و 1 دەبینین و کاتێک n بوو بە 0 لووپەکە دەوەستێت.","s":[["int n = 3;","گۆڕاوی <code>n</code> دروست دەکات و 3 دەیداتێ.",["n = 3"]],["while (n > 0)","تا n گەورەتر بێت لە 0 دووبارە دەبێتەوە.",[]],["Console.WriteLine(n);","n چاپ دەکات: 3 پاشان 2 پاشان 1.",[]],["n--;","n یەک کەم دەکات (3، 2، 1، 0). کاتێک بوو بە 0 لووپەکە دەوەستێت.",["n = 0 لە کۆتاییدا"]]],"sum":"پوختە: while سەرەتا مەرج دەپشکنێت و پاشان بلۆکەکە دەخوێنێتەوە."},{"c":"int k = 10;\ndo\n{\n  Console.WriteLine(k);\n  k++;\n}\nwhile (k < 5);","o":"10","intro":"سەرەتا گۆڕاوی <code>k</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 10ـمان پێدا. دواتر بە <code>do</code> بلۆکەکەمان دەست پێکرد: <code>Console.WriteLine</code> بەهای k چاپ دەکات و <code>k++</code> دەیکاتە 11. لە کۆتاییدا <code>while (k &lt; 5)</code> مەرج دەپشکنێت: 11 کەمترە لە 5؟ نەخێر، بۆیە لووپەکە دەوەستێت. بۆیە تەنها 10 دەبینین، چونکە بلۆکەکە یەکجار پێش پشکنینی مەرج دێت.","s":[["int k = 10;","گۆڕاوی <code>k</code> دروست دەکات و 10 دەیداتێ.",["k = 10"]],["do","دەستپێکی do/while: بلۆکەکە یەکجار پێش پشکنینی مەرج دێت.",[]],["Console.WriteLine(k);","k چاپ دەکات: 10.",[]],["k++;","k یەک زیاد دەکات و دەبێتە 11.",["k = 11"]],["while (k < 5);","ئێستا مەرج دەپشکنێت: 11 &lt; 5؟ نەخێر، لووپەکە دەوەستێت.",[]]],"sum":"پوختە: do/while لانی کەم یەکجار دەخوێنرێتەوە، چونکە مەرج لە کۆتاییدایە."},{"c":"for (int i = 1; i <= 5; i++)\n{\n  if (i == 3)\n  {\n    break;\n  }\n  Console.WriteLine(i);\n}","o":"1\n2","intro":"سەرەتا بە <code>for</code> گۆڕاوی <code>i</code>مان دروست کرد و بەهای 1ـمان پێدا، و مەرجمان دانا تا i کەمتر یان یەکسان بێت بە 5 لووپەکە بەردەوام بێت. دواتر لە ناو لووپەکە بە <code>if</code> پشکنیمان کرد ئایا i یەکسانە بە 3؛ کاتێک بوو، <code>break</code> لووپەکە دەوەستێنێت. ئەگەرنا <code>Console.WriteLine</code> بەهای i چاپ دەکات، بۆیە تەنها 1 و 2 دەبینین.","s":[["for (int i = 1; i <= 5; i++)","لووپ لە 1 تا 5.",[]],["if (i == 3)","دەپشکنێت ئایا i بووە بە 3.",[]],["break;","کاتێک i=3 بوو لووپەکە بە تەواوی دەوەستێت.",[]],["Console.WriteLine(i);","1 و 2 چاپ دەکات (3 نا، چونکە لووپەکە وەستا).",[]]],"sum":"پوختە: <code>break</code> لووپەکە بە تەواوی دەوەستێنێت."},{"c":"for (int j = 1; j <= 5; j++)\n{\n  if (j == 3)\n  {\n    continue;\n  }\n  Console.WriteLine(j);\n}","o":"1\n2\n4\n5","intro":"سەرەتا بە <code>for</code> گۆڕاوی <code>j</code>مان دروست کرد و بەهای 1ـمان پێدا، و مەرجمان دانا تا j کەمتر یان یەکسان بێت بە 5 لووپەکە بەردەوام بێت. دواتر لە ناو لووپەکە بە <code>if</code> پشکنیمان کرد ئایا j یەکسانە بە 3؛ کاتێک بوو، <code>continue</code> تەنها ئەم دووبارەبوونەوەیە بازدەدات. ئەگەرنا <code>Console.WriteLine</code> بەهای j چاپ دەکات، بۆیە 3 چاپ ناکرێت و 1 و 2 و 4 و 5 دەبینین.","s":[["for (int j = 1; j <= 5; j++)","لووپی <code>for</code> لە 1 تا 5.",[]],["if (j == 3)","دەپشکنێت ئایا j بووە بە 3.",[]],["continue;","تەنها ئەم دووبارەبوونەوەیە بازدەدات و دەچێتە j=4.",[]],["Console.WriteLine(j);","چاپ دەکات: 1 2 4 5 (3 نا).",[]]],"sum":"پوختە: <code>continue</code> تەنها یەک دووبارەبوونەوە بازدەدات و لووپەکە بەردەوام دەبێت."},{"c":"int n = 1;\nwhile (n <= 5)\n{\n  if (n == 4)\n  {\n    break;\n  }\n  Console.WriteLine(n);\n  n++;\n}","o":"1\n2\n3","intro":"سەرەتا گۆڕاوی <code>n</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 1ـمان پێدا. دواتر بە <code>while</code> مەرجمان دانا: تا n کەمتر یان یەکسان بێت بە 5 لووپەکە دووبارە ببێتەوە. لە ناو لووپەکە بە <code>if</code> پشکنیمان کرد ئایا n یەکسانە بە 4؛ کاتێک بوو، <code>break</code> لووپەکە دەوەستێنێت. ئەگەرنا <code>Console.WriteLine</code> بەهای n چاپ دەکات و <code>n++</code> یەک زیادی دەکات، بۆیە 1 و 2 و 3 دەبینین.","s":[["int n = 1;","گۆڕاوی <code>n</code> دروست دەکات و 1 دەیداتێ.",["n = 1"]],["while (n <= 5)","تا n کەمتر یان یەکسان بێت بە 5 لووپەکە دووبارە دەبێتەوە.",[]],["if (n == 4)","دەپشکنێت ئایا n بووە بە 4.",[]],["break;","کاتێک n=4 بوو لووپەکە بە تەواوی دەوەستێنێت.",[]],["Console.WriteLine(n);","n چاپ دەکات: 1 2 3.",[]],["n++;","n یەک زیاد دەکات (1، 2، 3، 4).",["n = 2 ، 3 ، 4"]]],"sum":"پوختە: <code>break</code> لووپی while بە تەواوی دەوەستێنێت."},{"c":"int i = 0;\nwhile (i < 5)\n{\n  i++;\n  if (i == 2)\n  {\n    continue;\n  }\n  Console.WriteLine(i);\n}","o":"1\n3\n4\n5","intro":"سەرەتا گۆڕاوی <code>i</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 0ـمان پێدا. دواتر بە <code>while</code> مەرجمان دانا: تا i کەمتر بێت لە 5 لووپەکە دووبارە ببێتەوە. لە ناو لووپەکە سەرەتا <code>i++</code> یەک زیادی دەکات، پاشان بە <code>if</code> پشکنیمان کرد ئایا i یەکسانە بە 2؛ کاتێک بوو، <code>continue</code> ئەم دووبارەبوونەوەیە بازدەدات. ئەگەرنا <code>Console.WriteLine</code> بەهای i چاپ دەکات، بۆیە 2 چاپ ناکرێت و 1 و 3 و 4 و 5 دەبینین.","s":[["int i = 0;","گۆڕاوی <code>i</code> دروست دەکات و 0 دەیداتێ.",["i = 0"]],["while (i < 5)","تا i کەمتر بێت لە 5 دووبارە دەبێتەوە.",[]],["i++;","i یەک زیاد دەکات. لێرە پێش continue نووسراوە بۆ ئەوەی لووپەکە بێکۆتایی نەبێت.",["i = 1 ، 2 ، 3 ..."]],["if (i == 2)","دەپشکنێت ئایا i بووە بە 2.",[]],["continue;","کاتێک i=2 بوو، ئەم دووبارەبوونەوەیە بازدەدات و چاپ ناکرێت.",[]],["Console.WriteLine(i);","i چاپ دەکات: 1 3 4 5.",[]]],"sum":"پوختە: لە while دا دەبێت i++ پێش continue بێت، ئەگەرنا i هەمیشە 2 دەمێنێتەوە."}];
function moreHtml(k){const m=MORE[k];if(!m)return '';const L=m.c.split('\n'),map={};let cur=0;
 m.s.forEach(([sn,tx,st])=>{for(let q=cur;q<L.length;q++){if(L[q].trim()===sn){map[q]=[tx,st||[]];cur=q+1;break;}}});
 const cards=L.map((l,i)=>{const t=l.trim();const d=map[i]||[t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—',[]];
  return `<div class="st"><div class="st-h"><span class="rng">هێڵی ${i+1}</span><b class="sn${t.length>=25?' xs':t.length>13?' sm':''}">${esc(t)}</b></div><p>${d[0]}</p>${d[1].length?`<div class="st-v"><span>بەهاکان دوای ئەم هێڵە:</span>${d[1].map(v=>`<i class="vs">${v}</i>`).join('')}</div>`:''}</div>`;}).join('');
 return `<button class="more-btn" onclick="toggleMore(${k},this)">ڕوونکردنەوەی زیاتر 📖</button>
<div class="more-panel" id="more${k}"><div class="more-title">ڕوونکردنەوەی زیاتر — بە نموونەیەکی نوێ</div><div class="walk"><span class="wl">کارەکەی ئەم کۆدە بەم شێوەیە:</span>${m.intro}</div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(m.o)}</div></div>
${cards}<p class="more-sum">${m.sum}</p></div>`;}
function toggleMore(k,b){const o=document.getElementById('more'+k).classList.toggle('open');b.textContent=o?'شاردنەوە 📕':'ڕوونکردنەوەی زیاتر 📖';if(k===6){if(!o){PS[1].on=false;PS[1].wide=false;pinApply(1);}pinSync();}}
const tabs=document.getElementById('tabs'),views=document.getElementById('views');
const n=i=>String(i).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
tabs.innerHTML=`<button class="tab active" onclick="showTab(0)">دەستپێک</button>`+E.map((_,i)=>`<button class="tab" onclick="showTab(${i+1})">کۆدی ${n(i+1)}</button>`).join('');
views.innerHTML=`<div class="content active"><div class="intro"><h2>🎯 بەخێربێیت</h2><p>لێرەدا <b>${n(E.length)} نموونە</b>ی C# دەبینیت لە PDF ـەکەوە، لە پەڕەی ١٨ تا ٣٧.</p><p>هەر نموونەیەک: سەردێڕ، کۆد لەگەڵ ژمارەی هێڵ، دەرەنجام و ڕوونکردنەوە.</p><p style="font-weight:bold;color:#667eea">دوگمەکانی سەرەوە هەڵبژێرە 👆</p></div></div>`+
E.map((e,k)=>{const L=e.c.split('\n');
return `<div class="content"><div class="example"><div class="title-row"><div class="example-title">${e.t}</div><span class="pdf-page">${e.p}</span></div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(e.o)}</div></div>
<div class="expl-box"><div class="expl-title">📚 ڕوونکردنەوە:</div><div class="walk"><span class="wl">کارەکەی ئەم کۆدە بەم شێوەیە:</span>${EXSUM[k]}</div><ul>${expl(e,EX[k])}</ul></div>${moreHtml(k)}</div></div>`}).join('');
let curTab=0,inMore=false;const PS=[{on:false,wide:false,lp:false,t:null,w:'pinWrap',x:'pinTxt'},{on:false,wide:false,lp:false,t:null,w:'pinWrap2',x:'pinTxt2'}];
function pinBox(n){const c=document.querySelectorAll('.content')[7];return c&&c.querySelector(n?'#more6 .code-box':'.example > .code-box');}
function pinApply(n){const q=PS[n];document.getElementById(q.w).classList.toggle('on',q.on);document.getElementById(q.x).textContent=!q.on?'pin':q.wide?'pinned · full':'pinned';pinSync();}
function pinFree(b){b.classList.remove('pinned','wide');b.style.left='';b.style.width='';b.style.top='';if(b._sp){b._sp.remove();b._sp=null;}}
function pinSync(){const w1=document.getElementById('pinWrap'),w2=document.getElementById('pinWrap2');
 if(curTab!==7){w1.classList.remove('show');w2.classList.remove('show');[0,1].forEach(n=>{const b=pinBox(n);if(b)pinFree(b);});return;}
 const m=document.getElementById('more6');inMore=false;
 if(m&&m.classList.contains('open')){const r=m.getBoundingClientRect();inMore=r.top<window.innerHeight*0.55&&r.bottom>120;}
 w1.classList.toggle('show',!inMore);w2.classList.toggle('show',inMore);
 [0,1].forEach(n=>{const q=PS[n],b=pinBox(n);if(!b)return;const cont=n?m:b.parentNode;
  if(!cont||(n&&!m.classList.contains('open'))){pinFree(b);return;}
  const nat=(b._sp||b).getBoundingClientRect(),cr=cont.getBoundingClientRect(),want=q.on&&(n?inMore:!inMore);
  if(want&&nat.top<0&&cr.bottom>0){
   if(!b._sp){const sp=document.createElement('div');sp.className='pin-spacer';sp.style.height=(b.offsetHeight+18)+'px';b.parentNode.insertBefore(sp,b);b._sp=sp;}
   b.classList.add('pinned');b.classList.toggle('wide',q.wide);
   const sr=b._sp.getBoundingClientRect();if(q.wide){b.style.left='';b.style.width='';}else{b.style.left=sr.left+'px';b.style.width=sr.width+'px';}
   b.style.top=Math.min(0,cr.bottom-b.offsetHeight)+'px';}
  else pinFree(b);});
 document.body.style.paddingTop='20px';}
function pinClick(n){const q=PS[n];if(q.lp){q.lp=false;return;}q.on=!q.on;if(!q.on)q.wide=false;pinApply(n);}
function pinDown(n){const q=PS[n];q.lp=false;clearTimeout(q.t);q.t=setTimeout(()=>{if(q.on){q.lp=true;q.wide=!q.wide;pinApply(n);if(navigator.vibrate)navigator.vibrate(40);}},700);}
function pinUp(n){clearTimeout(PS[n].t);}
window.addEventListener('scroll',pinSync,{passive:true});window.addEventListener('resize',pinSync);
function showTab(i){curTab=i;pinSync();setTimeout(pinSync,450);document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
 document.querySelectorAll('.content').forEach((c,k)=>c.classList.toggle('active',k===i));
 const el=k=>document.querySelectorAll('.content')[i];
 const t=i===0?null:document.querySelectorAll('.content')[i].querySelector('.title-row');
 if(t)t.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'});}
</script>
